<title>Atelier du Grimoire</title>
<!--FONTS-->
<style>
/* Mise en page : un manuscrit de travail. Bandeau du personnage en tête, onglets, puis le grimoire en rubriques par niveau. */
:root {
  --bg: #ECEEF1;
  --surface: #F9FAFB;
  --sunk: #E2E5EA;
  --note-bg: #F5EEDC;
  --ink: #1B2136;
  --muted: #5A6176;
  --rule: #C9CED8;
  --rubric: #A2261C;
  --rubric-soft: #F3DEDB;
  --gold: #8A6516;
  --ok: #2F6B45;
  --warn: #9A5B00;
  --focus: #2D57C7;
  --s-abj: #3A6EA5; --s-div: #6F6A9E; --s-enc: #B0467A; --s-evo: #C2410C;
  --s-ill: #7C4DBA; --s-inv: #1F8A70; --s-nec: #4B5563; --s-tra: #9A6A12;
  --f-display: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-sc: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --r: 6px;
  --pd-bg: #FBE7DC; --pd-bd: #C2410C; --pd-fg: #8F2F08; --pa-bg: #F3DEDB; --pa-bd: #A2261C; --pa-fg: #7A1C14; --ps-bg: #E6EAF5; --ps-bd: #2D4A9A; --ps-fg: #233C80; --pf-bg: #EFE6F7; --pf-bd: #6B3FA0; --pf-fg: #4F2C7A; --pn-bd: #9AA0AE;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131B; --surface: #171B26; --sunk: #0C0F15; --note-bg: #2A2416; --ink: #E8E4D8; --muted: #9CA2B4; --rule: #2B3142;
  --rubric: #E46F62; --rubric-soft: #3A1E1C; --gold: #D6AA4E; --ok: #6FC08E; --warn: #E8A64A; --focus: #8AA8FF;
  --s-abj: #7FA9DA; --s-div: #A8A3D6; --s-enc: #E07FAE; --s-evo: #F08A5D; --s-ill: #B392E8; --s-inv: #5CC7A8; --s-nec: #A3AAB8; --s-tra: #D9A94A;
  --pd-bg: #3A2214; --pd-bd: #F08A5D; --pd-fg: #F6B08E; --pa-bg: #3A1E1C; --pa-bd: #E46F62; --pa-fg: #F2A39A; --ps-bg: #1C2540; --ps-bd: #7F9BE0; --ps-fg: #AFC2F2; --pf-bg: #2C2140; --pf-bd: #B392E8; --pf-fg: #D3BDF5; --pn-bd: #4A5166;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131B; --surface: #171B26; --sunk: #0C0F15; --note-bg: #2A2416; --ink: #E8E4D8; --muted: #9CA2B4; --rule: #2B3142;
  --rubric: #E46F62; --rubric-soft: #3A1E1C; --gold: #D6AA4E; --ok: #6FC08E; --warn: #E8A64A; --focus: #8AA8FF;
  --s-abj: #7FA9DA; --s-div: #A8A3D6; --s-enc: #E07FAE; --s-evo: #F08A5D; --s-ill: #B392E8; --s-inv: #5CC7A8; --s-nec: #A3AAB8; --s-tra: #D9A94A;
  --pd-bg: #3A2214; --pd-bd: #F08A5D; --pd-fg: #F6B08E; --pa-bg: #3A1E1C; --pa-bd: #E46F62; --pa-fg: #F2A39A; --ps-bg: #1C2540; --ps-bd: #7F9BE0; --ps-fg: #AFC2F2; --pf-bg: #2C2140; --pf-bd: #B392E8; --pf-fg: #D3BDF5; --pn-bd: #4A5166;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sc { font-family: var(--f-sc); letter-spacing: .04em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Barre du haut */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
.brand { font-family: var(--f-sc); font-size: 15px; letter-spacing: .08em; color: var(--muted); }
.brand b { color: var(--rubric); font-weight: 700; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picker select { min-width: 0; max-width: 240px; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--warn); }

.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r); padding: 6px 12px; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--rubric); border-color: var(--rubric); color: var(--surface); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--rule); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-family: var(--f-sc); font-size: 12px; letter-spacing: .06em; color: var(--muted); }
input[type=text], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 9px; font-size: 15px; width: 100%; }
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }

/* En-tête du personnage */
.hero { margin-top: 18px; display: grid; gap: 14px; }
.title { font-family: var(--f-display); font-weight: 500; font-size: clamp(30px, 6vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; }
.title .initial { color: var(--rubric); font-weight: 700; }
.subline { font-family: var(--f-display); font-style: italic; color: var(--muted); font-size: 17px; }
.setup { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .setup { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.stats { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.stat { padding: 10px 8px 9px; text-align: center; border-left: 1px solid var(--rule); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .v { font-family: var(--f-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 16px; color: var(--muted); }
.stat .l { font-family: var(--f-sc); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin-top: 5px; }
.stat.alert .v { color: var(--warn); }
.stat.good .v { color: var(--ok); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } .stat:nth-child(4) { border-left: 0; } .stat:nth-child(n+4) { border-top: 1px solid var(--rule); } }

/* Onglets */
.tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 14px 8px; font-family: var(--f-sc); font-size: 15px; letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--rubric); }
.tab .count { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: 4px; }
.panel { margin-top: 18px; }
@media (max-width: 560px) { .tabs { flex-wrap: wrap; overflow: visible; } .tab { padding: 8px 10px 7px; font-size: 14px; } .tab .count { display: none; } }

/* Rubriques */
.rubric { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; border-bottom: 1.5px solid var(--rubric); padding-bottom: 4px; margin: 26px 0 8px; }
.rubric h2, .rubric h3, .rubric .h { font-family: var(--f-display); font-weight: 500; font-size: 22px; margin: 0; color: var(--rubric); }
.rubric .aside { font-size: 13.5px; color: var(--muted); font-style: italic; }
.rubric.locked { border-bottom-color: var(--rule); }
button.rubric.fold { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1.5px solid var(--rubric); border-radius: 0; padding: 0 0 4px; color: inherit; justify-content: flex-start; column-gap: 6px; }
button.rubric.fold .aside { margin-left: auto; }
button.rubric.fold .chev { font-size: 13px; color: var(--rubric); width: 12px; flex: none; align-self: center; }
button.rubric.fold .sum { font-size: 13.5px; color: var(--muted); }
button.rubric.fold.shut { background: var(--surface); border-radius: 6px 6px 0 0; padding: 7px 10px 6px; }
button.rubric.fold.locked { border-bottom-color: var(--rule); } button.rubric.fold.locked .chev, button.rubric.fold.locked .h { color: var(--muted); }
button.rubric.fold.rit { border-bottom-color: var(--ok); } button.rubric.fold.rit .chev, button.rubric.fold.rit .h { color: var(--ok); }
.rubric.locked h3 { color: var(--muted); }

/* Emplacements */
.slots { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 4px; }
.slotrow { display: grid; grid-template-columns: 86px 1fr auto; align-items: center; gap: 10px; padding: 3px 0; }
.slotrow + .slotrow { border-top: 1px dotted var(--rule); }
.slotrow .lv { font-family: var(--f-display); font-weight: 500; }
.pips { display: flex; flex-wrap: wrap; gap: 7px; }
.pip { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--rubric); background: transparent; padding: 0; }
.pip.used { background: var(--rubric); box-shadow: inset 0 0 0 3px var(--surface); }
.pip:hover { transform: scale(1.06); }
.slotrow .left { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.restbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--rubric); margin: 0; }

/* Lignes de sorts */
.spell { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 4px 10px; padding: 9px 4px; border-bottom: 1px solid var(--rule); align-items: start; }
.spell.noprep { grid-template-columns: minmax(0,1fr) auto; }
.spell .prep { padding-top: 3px; }
.spell .prep input { width: 20px; height: 20px; accent-color: var(--rubric); margin: 0; }
.spell .name { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.spell .vo { font-size: 13px; color: var(--muted); font-style: italic; margin-left: 6px; font-weight: 400; font-family: var(--f-body); }
.spell .meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
.spell .eff { font-size: 14.5px; margin-top: 3px; max-width: 72ch; }
.spell .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
@media (max-width: 560px) {
  .spell { grid-template-columns: 26px minmax(0,1fr); }
  .spell .actions { grid-column: 2; justify-content: flex-start; }
  .spell.noprep { grid-template-columns: minmax(0,1fr); }
  .spell.noprep .actions { grid-column: 1; }
}
.spell.prepared { background: linear-gradient(90deg, var(--rubric-soft), transparent 70%); }
.tag { display: inline-block; font-family: var(--f-sc); font-size: 11px; letter-spacing: .05em; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-left: 5px; vertical-align: 2px; line-height: 1.45; }
.tag.c { color: var(--rubric); }
.tag.r { color: var(--ok); }
.school { display: inline-flex; align-items: center; gap: 5px; }
.school::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sc, var(--muted)); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.pill { display: flex; flex-direction: column; padding: 4px 10px; border-radius: 5px; border: 1.5px solid var(--pn-bd); background: var(--surface); min-width: 0; }
.pill .pl { font-family: var(--f-sc); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.pill .pv { font-size: 17px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pill .ps { font-size: 12px; }
.pill .ps.conc { color: var(--rubric); font-weight: 500; }
.pill.d { background: var(--pd-bg); border-color: var(--pd-bd); color: var(--pd-fg); } .pill.d .pl { color: var(--pd-fg); }
.pill.a { background: var(--pa-bg); border-color: var(--pa-bd); color: var(--pa-fg); } .pill.a .pl { color: var(--pa-fg); }
.pill.s { background: var(--ps-bg); border-color: var(--ps-bd); color: var(--ps-fg); } .pill.s .pl { color: var(--ps-fg); }
.pill.f { background: var(--pf-bg); border-color: var(--pf-bd); color: var(--pf-fg); } .pill.f .pl { color: var(--pf-fg); }
.spell .up { font-size: 13px; color: var(--muted); margin-top: 3px; }
.origin { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.cost { font-size: 12.5px; color: var(--gold); }
.empty { padding: 14px 4px; color: var(--muted); font-style: italic; font-size: 14.5px; }
.note { border-left: 3px solid var(--gold); background: var(--surface); padding: 9px 12px; font-size: 14.5px; margin: 10px 0; border-radius: 0 var(--r) var(--r) 0; }
.note.warn { border-left-color: var(--warn); }
.note b { color: var(--ink); }

/* Bibliothèque */
.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 3px 11px; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.dim { color: var(--muted); }
.frow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.frow .field { flex: 1 1 200px; }
.found { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }

/* Divers */
.extras { display: grid; gap: 0; }
.extra { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule); }
.extra .n { font-family: var(--f-display); font-weight: 700; }
.extra.edit { grid-template-columns: minmax(0,1fr); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; margin: 6px 0; }
.extra.edit .fields { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr); gap: 8px; }
@media (max-width: 640px) { .extra.edit .fields { grid-template-columns: 1fr; } }
.extra.edit .bar { display: flex; gap: 8px; justify-content: flex-end; }
.extra.edit textarea { min-height: 42px; }
.addrow { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,2fr) auto auto; gap: 8px; margin-top: 10px; }
@media (max-width: 640px) { .addrow { grid-template-columns: 1fr 1fr; } }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 28px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.rules p { margin: 0 0 8px; font-size: 14.5px; max-width: 65ch; }
.rules b { color: var(--rubric); font-weight: 500; }
.confirm { color: var(--warn); border-color: var(--warn); }
.banner { margin-top: 14px; padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--rule); font-size: 14.5px; }
.welcome { margin-top: 40px; display: grid; gap: 14px; justify-items: start; max-width: 60ch; }
.welcome h1 { font-family: var(--f-display); font-weight: 500; font-size: 40px; margin: 0; }
.welcome h1 .initial { color: var(--rubric); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 9; max-width: calc(100% - 32px); width: max-content; display: flex; align-items: center; gap: 14px; }
.toast.above-bar { bottom: calc(var(--barh, 58px) + 16px); }
.toast.on-top { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
.toast .undo { background: transparent; border: 0; color: var(--rubric-soft); font-weight: 700; padding: 4px 2px; }
/* Lancer un sort */
.cast { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.btn.cast-go { background: var(--rubric); border-color: var(--rubric); color: var(--surface); font-weight: 500; padding: 7px 14px; }
.btn.cast-up { padding: 7px 11px; }
.btn.cast-rit { border-color: var(--ok); color: var(--ok); padding: 7px 14px; }
.btn.cast-none { border-style: dashed; background: transparent; color: var(--muted); padding: 7px 14px; }
.chooser { margin-top: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; display: grid; gap: 8px; max-width: 420px; }
.chooser .lbl { font-family: var(--f-sc); font-size: 12px; letter-spacing: .05em; color: var(--muted); }
.chooser .lvls { display: flex; flex-wrap: wrap; gap: 6px; }
.chooser .lvls .btn { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; border-color: var(--rubric); color: var(--pa-fg); }
.chooser .lvls .btn small { font-size: 12px; }
.chooser .hint { font-size: 13.5px; color: var(--pd-fg); background: var(--pd-bg); border-radius: 5px; padding: 6px 8px; }
/* Barre fixe des emplacements */
.slotbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--rule); padding: 0 16px env(safe-area-inset-bottom, 0px); color: var(--ink); }
.slotbar .fx { display: flex; gap: 6px; padding-top: 8px; overflow-x: auto; scrollbar-width: none; }
.slotbar .chip { flex: none; font-size: 13px; border-radius: 999px; padding: 3px 10px; white-space: nowrap; border: 1px solid var(--pf-bd); background: var(--pf-bg); color: var(--pf-fg); }
.slotbar .chip.conc { background: var(--rubric); border-color: var(--rubric); color: var(--surface); font-weight: 700; }
.slotbar .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 54px; background: transparent; border: 0; padding: 0; color: inherit; text-align: left; }
.slotbar .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-width: 0; }
.slotbar .lv { display: inline-flex; align-items: center; gap: 4px; }
.slotbar .lv b { font-family: var(--f-display); font-size: 15px; margin-right: 2px; }
.slotbar .d { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--rubric); box-sizing: border-box; display: inline-block; }
.slotbar .d.u { background: var(--rubric); }
#slots-top { scroll-margin-top: 12px; }
.slotbar .go { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
body.has-slotbar .wrap { padding-block-end: calc(var(--barh, 58px) + 40px); }
/* Panneau de concentration */
.concpanel { position: fixed; left: 10px; right: 10px; bottom: calc(var(--barh, 58px) + 8px); z-index: 6; max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 6px 20px rgba(27,33,54,.18); padding: 12px 14px; display: grid; gap: 10px; }
.concpanel .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.concpanel .head b { font-family: var(--f-display); font-size: 17px; }
.concpanel p { margin: 0; font-size: 14px; line-height: 1.4; }
.concpanel .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.concpanel input { width: 80px; }
.kp { display: inline-block; font-size: 13px; font-weight: 700; border: 1.2px solid var(--pn-bd); border-radius: 4px; padding: 1px 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kp.d { background: var(--pd-bg); border-color: var(--pd-bd); color: var(--pd-fg); }
.kp.a { background: var(--pa-bg); border-color: var(--pa-bd); color: var(--pa-fg); }
.kp.s { background: var(--ps-bg); border-color: var(--ps-bd); color: var(--ps-fg); }
.kp.f { background: var(--pf-bg); border-color: var(--pf-bd); color: var(--pf-fg); }
.concwarn { margin-top: 8px; background: var(--surface); border: 1.5px solid var(--warn); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; max-width: 520px; font-size: 14.5px; line-height: 1.4; }
.concwarn .cast { margin-top: 4px; }
.wsactive .wsconc { margin-top: 0; max-width: none; }
.live { font-size: 12.5px; font-weight: 700; color: var(--rubric); white-space: nowrap; margin-left: 6px; }
/* Bascule Gérer / En jeu */
.viewsw { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); background: var(--sunk); border-radius: 8px; padding: 3px; max-width: 360px; margin-bottom: 6px; }
.viewsw button { border: 0; background: transparent; color: var(--muted); padding: 8px; border-radius: 6px; font-size: 14.5px; }

<script>
const SPELLS = /*SPELLS*/[];
const BY_ID = Object.fromEntries(SPELLS.map(s => [s.id, s]));
const BEASTS = /*BEASTS*/[]; // bêtes du Manuel des monstres (Forme sauvage) : fp, ca, pv, v (vitesses), st (FOR, DEX, CON), cp (compétences), tr (capacités), ac (actions)
const BEAST = Object.fromEntries(BEASTS.map(b => [b.id, b]));
// Page ouverte seule (fichier exporté) plutôt que dans le cadre de claude.ai
const STANDALONE = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
const SCHOOLS = ["Abjuration","Divination","Enchantement","Évocation","Illusion","Invocation","Nécromancie","Transmutation"];
const SCHOOL_VAR = {"Abjuration":"--s-abj","Divination":"--s-div","Enchantement":"--s-enc","Évocation":"--s-evo","Illusion":"--s-ill","Invocation":"--s-inv","Nécromancie":"--s-nec","Transmutation":"--s-tra"};
// Emplacements du magicien (Manuel des joueurs 2014, tableau du magicien)
const SLOTS = {1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],9:[4,3,3,3,1],10:[4,3,3,3,2],
  11:[4,3,3,3,2,1],12:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],14:[4,3,3,3,2,1,1],15:[4,3,3,3,2,1,1,1],16:[4,3,3,3,2,1,1,1],
  17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]};
// Emplacements des demi-lanceurs (paladin), Manuel des joueurs 2014
const HALF = {1:[],2:[2],3:[3],4:[3],5:[4,2],6:[4,2],7:[4,3],8:[4,3],9:[4,3,2],10:[4,3,2],11:[4,3,3],12:[4,3,3],13:[4,3,3,1],14:[4,3,3,1],
  15:[4,3,3,2],16:[4,3,3,2],17:[4,3,3,3,1],18:[4,3,3,3,1],19:[4,3,3,3,2],20:[4,3,3,3,2]};
// Serments du paladin : sorts toujours préparés, par niveau de paladin (Guide de Xanathar pour la Conquête)
const OATHS = {
  conquete: { n: "Conquête", full: "Serment de la conquête",
    cd: [
      { k: "presence", n: "Présence conquérante", fx: "1 minute", pills: g => [["f", "Effet", "Effrayée"], ["s", "Jet de la cible", `JdS SAG · DD ${8 + R.prof(g.level) + R.am(g)}`, "nouveau jet à chaque fin de tour"], ["n", "Zone", "9 m"], ["n", "Durée", "1 minute"]],
        e: "Action. Chaque créature de ton choix à 9 m ou moins qui rate son jet est effrayée." },
      { k: "guided", n: "Frappe guidée", btn: "Frappe guidée · +10", e: "+10 à un jet d'attaque, après avoir vu le d20 mais avant de savoir s'il touche." },
    ],
    sp: {3: ["armor-of-agathys", "command"], 5: ["hold-person", "spiritual-weapon"], 9: ["bestow-curse", "fear"], 13: ["dominate-beast", "stoneskin"], 17: ["cloudkill", "dominate-person"]} },
};
// Classes : caractéristique d'incantation, table d'emplacements, préparation, sous-classe
const CLASSES = {
  magicien: { n: "Magicien", ab: "int", abN: "Intelligence", slots: SLOTS, top: 9, book: true,
    cantrips: lv => lv >= 10 ? 5 : lv >= 4 ? 4 : 3, prep: (g, m) => Math.max(1, m + g.level) },
  paladin: { n: "Paladin", ab: "cha", abN: "Charisme", slots: HALF, top: 5, book: false,
    cantrips: () => 0, prep: (g, m) => Math.max(1, m + Math.floor(g.level / 2)) },
  druide: { n: "Druide", ab: "wis", abN: "Sagesse", slots: SLOTS, top: 9, book: false,
    cantrips: lv => lv >= 10 ? 4 : lv >= 4 ? 3 : 2, prep: (g, m) => Math.max(1, m + g.level) },
};
const isPal = g => !!g && g.cls === "paladin", isDru = g => !!g && g.cls === "druide";
// Cercles du druide (Cercle de la Lune pour l'instant)
const CIRCLES = { lune: { n: "Lune", full: "Cercle de la Lune" } };
const DRU = {
  ws: g => g.level >= 20 ? 99 : g.level >= 2 ? 2 : 0,          // Forme sauvage : 2 utilisations, repos court (illimitée au niveau 20)
  fp: g => g.level >= 6 ? Math.floor(g.level / 3) : 1,          // Cercle de la Lune : FP 1, puis niveau ÷ 3 dès le niveau 6
  hours: g => Math.floor(g.level / 2),
};
const C = g => CLASSES[g && g.cls] || CLASSES.magicien;
const isWiz = g => C(g) === CLASSES.magicien;
const inClass = (g, s) => (s.cl || ["magicien"]).includes(g.cls || "magicien");
const classSpells = g => SPELLS.filter(s => inClass(g, s));
const oathSpells = g => { const o = isPal(g) && OATHS[g.oath]; if (!o) return []; return Object.entries(o.sp).filter(([lv]) => g.level >= +lv).flatMap(([, ids]) => ids).filter(id => BY_ID[id]); };
const isOath = (g, s) => !isWiz(g) && oathSpells(g).includes(s.id);
// Sorts lançables en jeu : préparés (+ sorts de serment pour le paladin)
function castable(g) {
  if (isWiz(g)) { const pr = new Set(g.prepared); return g.spells.map(x => BY_ID[x.id]).filter(s => s && pr.has(s.id)); }
  const ids = [...new Set([...oathSpells(g), ...g.prepared])];
  return ids.map(id => BY_ID[id]).filter(s => s && s.l <= R.maxLevel(g));
}
const PAL = {
  loh: g => 5 * g.level,                                   // Imposition des mains : réserve de PV
  ds: g => Math.max(1, 1 + R.am(g)),                       // Perception divine : 1 + mod. CHA, repos long
  cd: g => g.level >= 3 ? 1 : 0,                           // Conduit divin : 1, repos court
  smite: lv => Math.min(5, lv + 1),                        // Châtiment divin : 2d8 au niv. 1, +1d8 par niveau, 5d8 max
};
const LVL_NAME = ["Sorts mineurs","Niveau 1","Niveau 2","Niveau 3","Niveau 4","Niveau 5","Niveau 6","Niveau 7","Niveau 8","Niveau 9"];

// ---------- Règles ----------
const R = {
  prof: lv => 2 + Math.floor((lv - 1) / 4),
  mod: sc => Math.floor((sc - 10) / 2),
  am: g => R.mod(+g[C(g).ab] || 10), // modificateur de la caractéristique d'incantation
  slots: (g, lv = g.level) => C(g).slots[lv] || [],
  maxLevel: (g, lv = g.level) => (C(g).slots[lv] || []).length,
  unlockAt: (g, sl) => { for (let lv = 1; lv <= 20; lv++) if ((C(g).slots[lv] || []).length >= sl) return lv; return 21; },
  cantrips: (g, lv = g.level) => C(g).cantrips(lv),
  prepMax: g => C(g).prep(g, R.am(g)),
  expected: lv => 6 + 2 * (lv - 1),
  arcane: lv => Math.ceil(lv / 2),
  savant: (g, s) => g.level >= 2 && s.s === g.school,
  copy: (g, s) => { const k = R.savant(g, s) ? 0.5 : 1; return { h: 2 * s.l * k, po: 50 * s.l * k }; },
};
const signed = n => (n >= 0 ? "+" : "−") + Math.abs(n);
const fmt = n => String(n).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = n => n.toLocaleString("fr-FR");

// ---------- État ----------
const S = { list: {}, cur: null, tab: "grimoire", mode: "pending", readonly: false, view: "gerer", fxOpen: false, shortOpen: false, sr: {}, open: new Set(), concWarn: null, concPanel: false,
  f: { q: "", lvl: "all", school: "", conc: false, rit: false, hideOwned: false, reachable: false },
  bf: { q: "", fp: "all", mv: "", sz: "", reach: false, fav: false },
  confirm: null, newForm: false };
S.fold = {}; try { S.fold = JSON.parse(localStorage.getItem("grimoire.fold") || "{}") || {}; } catch (e) {}
try { const t = localStorage.getItem("grimoire.tab"); if (t) S.tab = t; if (localStorage.getItem("grimoire.view") === "jeu") S.view = "jeu"; } catch (e) {}

function blank(name, cls) {
  cls = CLASSES[cls] ? cls : "magicien";
  return { cls, name: name || "Nouveau " + CLASSES[cls].n.toLowerCase(), level: 1, int: 16, cha: 14, wis: 16, school: "Évocation", oath: "conquete", circle: "lune", cantrips: [], spells: [],
    prepared: [], used: {}, arcane: false, extras: [], effects: [], notes: "", snotes: {}, favs: [], wsForm: null, loh: 0, dsU: 0, cdU: 0, wsU: 0, updatedAt: Date.now() };
}
const fxKey = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NO_TRACK = ["Instantanée", "Jusqu'à dissipation", "Spéciale"]; // durées non suivies dans « En cours »
function norm(g) {
  // Les documents reçus de la base sont figés (lecture seule) : on travaille sur une copie profonde.
  const b = blank(); const o = Object.assign(b, JSON.parse(JSON.stringify(g || {})));
  if (!CLASSES[o.cls]) o.cls = "magicien"; // anciens fichiers : magicien
  o.level = Math.min(20, Math.max(1, +o.level || 1)); o.int = Math.min(30, Math.max(1, +o.int || 10)); o.cha = Math.min(30, Math.max(1, +o.cha || 10)); o.wis = Math.min(30, Math.max(1, +o.wis || 10));
  if (!CIRCLES[o.circle]) o.circle = "lune";
  if (!Array.isArray(o.favs)) o.favs = []; o.favs = o.favs.filter(id => BEAST[id]);            // druide : formes favorites
  if (!o.wsForm || !BEAST[o.wsForm.id]) o.wsForm = null;                                         // druide : forme active {id, hp, max}
  if (!OATHS[o.oath]) o.oath = "conquete";
  if (typeof o.style !== "string") o.style = ""; // paladin : style de combat
  ["loh", "dsU", "cdU", "wsU"].forEach(k => { o[k] = Math.max(0, +o[k] || 0); }); // paladin : PV d'Imposition dépensés, Perception divine et Conduit divin utilisés
  ["cantrips","spells","prepared","extras"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  o.spells = o.spells.filter(x => x && BY_ID[x.id]); o.cantrips = o.cantrips.filter(id => BY_ID[id]);
  // Magicien : un sort préparé doit être dans le grimoire. Paladin : dans la liste de sa classe.
  o.prepared = [...new Set(o.prepared)].filter(id => o.cls === "magicien" ? o.spells.some(x => x.id === id) : BY_ID[id] && (BY_ID[id].cl || []).includes(o.cls));
  if (!o.used || typeof o.used !== "object") o.used = {};
  if (!o.snotes || typeof o.snotes !== "object" || Array.isArray(o.snotes)) o.snotes = {}; // notes personnelles par sort : {id: texte}
  if (!Array.isArray(o.effects)) o.effects = []; // sorts en cours : {k, id, name, d, c (concentration), note}
  o.effects.forEach(e => { if (!e.k) e.k = fxKey(); });
  return o;
}
const G = () => S.cur && S.list[S.cur] ? S.list[S.cur] : null;

// ---------- Stockage ----------
let db = null; const dirty = new Set(); const timers = {}; const writing = {}; const rev = {};
function cacheLocal() { try { localStorage.setItem("grimoire.cache", JSON.stringify(S.list)); } catch (e) {} }
function loadLocal() { try { const c = JSON.parse(localStorage.getItem("grimoire.cache") || "{}"); for (const k in c) S.list[k] = norm(c[k]); } catch (e) {} }
function save(id) {
  const g = S.list[id]; if (!g) return; g.updatedAt = Date.now(); cacheLocal();
  if (S.mode !== "db" || S.readonly) { setStatus(S.mode === "db" ? "" : "Enregistré sur cet appareil"); return; }
  rev[id] = (rev[id] || 0) + 1; dirty.add(id); setStatus("Enregistrement…");
  clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 650);
}
async function flush(id) {
  if (writing[id]) { timers[id] = setTimeout(() => flush(id), 300); return; }
  writing[id] = true;
  try {
    if (!S.list[id]) { dirty.delete(id); return; }
    const r0 = rev[id], body = JSON.parse(JSON.stringify(S.list[id]));
    await db.collection("grimoires").doc(id).set(body);
    if (rev[id] === r0) dirty.delete(id);
    setStatus("Enregistré");
  } catch (e) {
    if (e && e.code === "invalid_argument") { S.readonly = true; setStatus("Lecture seule", true); render(); }
    else if (e && e.code === "quota_exceeded") setStatus("Stockage plein : supprime un grimoire.", true);
    else { setStatus("Échec de l'enregistrement, nouvel essai…", true); setTimeout(() => flush(id), 1500 + Math.random() * 1000); }
  } finally { writing[id] = false; }
}
async function removeDoc(id) {
  delete S.list[id]; cacheLocal();
  if (S.mode === "db" && !S.readonly) { try { await db.collection("grimoires").doc(id).delete(); } catch (e) { setStatus("Suppression impossible", true); } }
}
function setStatus(t, err) { const el = document.getElementById("status"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } S.statusText = t; S.statusErr = !!err; }

async function boot() {
  loadLocal(); pickCurrent(); render();
  try { db = window.claude && !STANDALONE ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { S.mode = "local"; setStatus("Enregistré sur cet appareil"); render(); return; }
  S.mode = "db";
  let first = true;
  db.collection("grimoires").onSnapshot(snap => {
    const fresh = {};
    snap.docs.forEach(d => { fresh[d.id] = norm(d.data()); });
    for (const id of dirty) if (S.list[id]) fresh[id] = S.list[id];
    S.list = fresh; cacheLocal(); pickCurrent();
    if (first) { first = false; setStatus("Synchronisé"); }
    render(true);
  }, err => { setStatus("Synchronisation interrompue", true); });
}
function pickCurrent() {
  let want = S.cur; if (!want) { try { want = localStorage.getItem("grimoire.cur"); } catch (e) {} }
  const ids = Object.keys(S.list);
  S.cur = want && S.list[want] ? want : (ids.sort((a, b) => S.list[b].updatedAt - S.list[a].updatedAt)[0] || null);
}
function setCur(id) { S.cur = id; S.editX = null; S.xdraft = null; S.open.clear(); try { localStorage.setItem("grimoire.cur", id); } catch (e) {} render(); }
function newId(name) { return (name || "mage").normalize("NFD").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 30) + "-" + Math.random().toString(36).slice(2, 7); }

// ---------- Rendu ----------
function render(fromSnapshot) {
  const a = document.activeElement; const keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  renderPicker();
  const g = G(); const main = document.getElementById("main");
  if (!g) { main.innerHTML = welcomeHTML(); }
  else {
    const scrollY = window.scrollY;
    main.innerHTML = heroHTML(g) + tabsHTML(g) + `<div class="panel" id="panel">${panelHTML(g)}</div>`;
    if (fromSnapshot) window.scrollTo(0, scrollY);
  }
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  setStatus(S.statusText || "", S.statusErr);
  const bar = document.getElementById("slotbar"), showBar = !!g && S.tab === "grimoire" && R.slots(g).length > 0;
  bar.hidden = !showBar; if (showBar) bar.innerHTML = slotbarHTML(g);
  document.body.classList.toggle("has-slotbar", showBar);
  document.documentElement.style.setProperty("--barh", (showBar ? bar.offsetHeight : 0) + "px");
  document.getElementById("toast").classList.toggle("above-bar", showBar);
  const cp = document.getElementById("concpanel"), cur = g && concOf(g), showCp = showBar && S.concPanel && !!cur;
  cp.hidden = !showCp; if (showCp) cp.innerHTML = concPanelHTML(cur);
  const showFx = showBar && S.fxOpen && g.effects.length > 0, fs = document.getElementById("fxsheet");
  fs.hidden = !showFx; document.getElementById("fxback").hidden = !showFx; if (showFx) fs.innerHTML = fxSheetHTML(g);
  if (!showFx) S.fxOpen = false;
  const lh = document.getElementById("lohsheet"), showLh = !!g && !!S.lohOpen && !isWiz(g) && !S.readonly;
  if (!showLh) S.lohOpen = false;
  lh.hidden = !showLh; document.getElementById("lohback").hidden = !showLh; if (showLh) lh.innerHTML = lohHTML(g);
  const nw = document.getElementById("nwsheet"), showNw = !!S.newOpen && !S.readonly;
  nw.hidden = !showNw; document.getElementById("nwback").hidden = !showNw; if (showNw) nw.innerHTML = newHTML();
  const lu = document.getElementById("lvlup"), showLu = !!g && !!S.lu && !S.readonly;
  if (!showLu) S.lu = null;
  lu.hidden = !showLu; document.body.classList.toggle("lu-on", showLu);
  if (showLu) { const sc = lu.querySelector(".lubody"), top = sc ? sc.scrollTop : 0; lu.innerHTML = luHTML(g); const nb = lu.querySelector(".lubody"); if (nb && S.luKeep) nb.scrollTop = top; S.luKeep = false; }
  const ws = document.getElementById("wssheet"), showWs = !!g && !!S.ws && isDru(g) && !S.readonly && !showLu;
  if (!showWs) S.ws = null;
  ws.hidden = !showWs; document.body.classList.toggle("ws-on", showWs);
  if (showWs) { const sc = ws.querySelector(".lubody"), top = sc ? sc.scrollTop : 0; ws.innerHTML = wsSheetHTML(g); const nb = ws.querySelector(".lubody"); if (nb && !S.wsTop) nb.scrollTop = top; S.wsTop = false; } // la liste garde sa position (sauf changement de filtre)
  document.getElementById("toast").classList.toggle("on-top", showFx || showLu || showLh || showNw || showWs);
}
function renderPicker() {
  const ids = Object.keys(S.list).sort((a, b) => S.list[a].name.localeCompare(S.list[b].name, "fr"));
  const p = document.getElementById("picker");
  p.innerHTML = (ids.length ? `<select id="cur" aria-label="Grimoire affiché">${ids.map(id => `<option value="${esc(id)}"${id === S.cur ? " selected" : ""}>${esc(S.list[id].name)} · ${C(S.list[id]).n} ${S.list[id].level}</option>`).join("")}</select>` : "")
    + (ids.length ? `<button class="btn" data-a="new"${S.readonly ? " disabled" : ""}>Nouveau personnage</button>` : "") + `<span class="status" id="status"></span>`;
}
function welcomeHTML() {
  return `<div class="welcome"><h1><span class="initial">G</span>rimoires</h1>
  <p>Aucun personnage pour l'instant. Crée un magicien, un paladin ou un druide : l'atelier calcule ses emplacements, ses sorts préparés et ses ressources d'après le Manuel des joueurs. Tu as déjà une sauvegarde (fichier .json ou .txt) ? Importe-la.</p>
  <div class="frow"><button class="btn primary" data-a="new"${S.readonly ? " disabled" : ""}>Créer un personnage</button>${S.readonly ? "" : `<label class="btn" for="f-import">Importer une sauvegarde</label><input id="f-import" type="file" accept=".json,.txt,application/json,text/plain" hidden>`}</div></div>`;
}
function heroHTML(g) {
  const prof = R.prof(g.level), mod = R.am(g), max = R.maxLevel(g);
  const nPrep = g.prepared.length, pMax = R.prepMax(g), exp = R.expected(g.level), nSp = g.spells.length, cMax = R.cantrips(g);
  const ro = S.readonly ? " disabled" : "";
  const first = esc(g.name.charAt(0)), rest = esc(g.name.slice(1));
  return `<section class="hero">
  <div>
    <h1 class="title" id="title"><span class="initial">${first}</span>${rest}</h1>
    <div class="subline">${isWiz(g) ? `Niveau ${g.level} · École ${/^[AÉEIO]/.test(g.school) ? "d'" : "de "}${esc(g.school)}` : `${C(g).n} niveau ${g.level}${isPal(g) && g.level >= 3 ? ` · ${esc(OATHS[g.oath].full)}` : isDru(g) && g.level >= 2 ? ` · ${esc(CIRCLES[g.circle].full)}` : ""}`} · ${max ? `sorts jusqu'au niveau ${max}` : `sorts au niveau ${R.unlockAt(g, 1)}`}</div>
  </div>
  <div class="setup">
    <div class="field"><label for="f-full">Nom complet</label><input id="f-full" type="text" value="${esc(g.name)}"${ro}></div>

}
function jeuRow(g, s, kind) {

  let act = "";
  if (!open && !S.readonly) {
    if (kind === "prep") { const lv = firstFree(g, s); act = lv ? `<button class="btn cast-go sm" data-a="cast" data-id="${s.id}" data-l="${lv}">${lv === s.l ? "Lancer" : "Lancer · niv. " + lv}</button>` : `<button class="btn cast-none sm" disabled>Épuisé</button>`; }
    else if (kind === "rit") act = `<button class="btn cast-rit sm" data-a="cast-rit" data-id="${s.id}">Rituel</button>`;
  }

  ${open ? `<div class="jbody">${pillsHTML(s, g)}<div class="eff">${esc(s.e)}</div>${s.up ? `<div class="up">${s.l === 0 ? "Progression" : "Emplacement plus élevé"} : ${esc(s.up)}</div>` : ""}${noteOf(g, s) ? noteBox(g, s) : ""}${kind !== "cantrip" && !S.readonly ? castHTML(g, s, kind === "prep") : ""}</div>` : ""}${concWarnHTML(g, s)}</div>`;
}
function jeuHTML(g) {
  const prepared = new Set(g.prepared), max = R.maxLevel(g), slots = R.slots(g), ready = castable(g);
  let h = isPal(g) ? smiteHTML(g) : "";
  // Paladin : sorts de serment dans leur propre section, comme dans Gérer

  const cans = g.cantrips.map(id => BY_ID[id]).sort(byName);

    if (!list.length) continue;
    h += foldHead("l" + lv, "", `Niveau ${lv}`, `${slotsLeft(g, lv)} / ${slots[lv - 1]} restant${slotsLeft(g, lv) > 1 ? "s" : ""}`, plural(list.length, "sort"));
    if (!isFold("l" + lv)) list.forEach(s => { h += jeuRow(g, s, "prep"); });
  }
  if (!ready.length && max) h += `<div class="empty">Aucun sort préparé. Passe en mode « Gérer » pour cocher les sorts du jour.</div>`;

  if (rits.length) { h += foldHead("r", "rit", "Rituels", "depuis le grimoire, +10 min, sans emplacement", plural(rits.length, "sort")); if (!isFold("r")) rits.forEach(s => { h += jeuRow(g, s, "rit"); }); }
  if (g.extras.length) {
    h += foldHead("x", "", "Autres sorts", "", plural(g.extras.length, "sort"));

  return h;
}

function biblioHTML(g) {
  const f = S.f, max = R.maxLevel(g), wiz = isWiz(g), top = C(g).top;
  const hasC = C(g).cantrips(20) > 0;

  let h = `<div class="filters">

      <div class="field" style="flex:0 1 200px"><label for="f-sch">École</label><select id="f-sch"><option value="">Toutes les écoles</option>${SCHOOLS.map(s => `<option${s === f.school ? " selected" : ""}>${s}</option>`).join("")}</select></div>
    </div>
    <div class="frow">
      <label class="check"><input type="checkbox" data-a="ftog" data-v="conc"${f.conc ? " checked" : ""}> Concentration</label>

    </div></div>

  let cur = -1;

    // Sans recherche : une ligne par sort, dépliable. Avec une recherche : résultats affichés en entier.
    if (!q) { h += libRow(g, s, owned, max, f.lvl === "all" ? "" : LVL_NAME[s.l] + " · "); return; }

}
function libRow(g, s, owned, max, prefix) {
